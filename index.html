<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پورتال استعلام وضعیت مالی نمایندگان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-indigo: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.8);
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-border: #ef4444;
      --error-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.25);
      color: var(--accent-cyan);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .brand-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .brand-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      direction: ltr;
      text-align: right;
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    button.btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 0.95rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    button.btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(6, 182, 212, 0.5);
    }

    button.btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-top: 1.25rem;
      display: none;
      line-height: 1.5;
    }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    /* نتایج استعلام */
    .result-section {
      display: none;
      margin-top: 1.5rem;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-title {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .metric-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-cyan);
      direction: ltr;
    }

    .message-box {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 14px;
      padding: 1.1rem;
      margin-bottom: 1.25rem;
    }

    .message-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .message-content {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
    }

    .btn-reset {
      width: 100%;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 12px;
      padding: 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <div class="badge">KARO BI PORTAL</div>
      <h1>استعلام وضعیت نمایندگان</h1>
      <p>جهت مشاهده وضعیت مالی، مشخصات را وارد نمایید</p>
    </div>

    <!-- فرم ورودی -->
    <form id="queryForm">
      <div class="form-group">
        <label for="nid">کد ملی</label>
        <input type="tel" id="nid" placeholder="مثال: 0012345678" maxlength="10" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="phone">شماره همراه</label>
        <input type="tel" id="phone" placeholder="مثال: 09121234567" maxlength="11" required autocomplete="off">
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">مشاهده اطلاعات</span>
      </button>

      <div id="alertBox" class="alert alert-error"></div>
    </form>

    <!-- بخش نمایش نتیجه -->
    <div id="resultBox" class="result-section">
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-title">شاخص اول (Metric 1)</span>
          <span class="metric-val" id="resM1">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">شاخص دوم (Metric 2)</span>
          <span class="metric-val" id="resM2">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">شاخص سوم (Metric 3)</span>
          <span class="metric-val" id="resM3">-</span>
        </div>
      </div>

      <div class="message-box">
        <div class="message-title">پیام اختصاصی شما</div>
        <div class="message-content" id="resMsg">-</div>
      </div>

      <button type="button" id="resetBtn" class="btn-reset">استعلام جدید</button>
    </div>
  </div>

  <script>
    // آدرس وب‌اپ گوگل اسکریپت
    const SCRIPT_URL = "https://script.google.com/macros/s/GAPGPTMASKTOKENpubsoxpw8cX0X/exec";

    const form = document.getElementById('queryForm');
    const nidInput = document.getElementById('nid');
    const phoneInput = document.getElementById('phone');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const alertBox = document.getElementById('alertBox');
    const resultBox = document.getElementById('resultBox');
    const resetBtn = document.getElementById('resetBtn');

    // تبدیل ارقام فارسی و عربی به انگلیسی
    function normalizeDigits(str) {
      if (!str) return "";
      const p = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      const a = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      let res = str.toString().trim();
      for (let i = 0; i < 10; i++) {
        res = res.replaceAll(p[i], i).replaceAll(a[i], i);
      }
      return res;
    }

    // فرمت کردن ارقام با کاما (fa-IR)
    function formatNumber(val) {
      if (val === null || val === undefined || val === "") return "-";
      const num = Number(val);
      if (!isNaN(num) && typeof val !== "boolean") {
        return num.toLocaleString('fa-IR');
      }
      return val;
    }

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> در حال بررسی...';
      } else {
        submitBtn.disabled = false;
        btnText.textContent = 'مشاهده اطلاعات';
      }
    }

    // هسته اصلی اتصال: تکنیک JSONP برای عبور تضمینی از CORS و Redirect
    function fetchJSONP(url, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random()) + '_' + Date.now();
        const script = document.createElement('script');
        let timer = null;

        const cleanUp = () => {
          if (timer) clearTimeout(timer);
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[callbackName];
        };

        window[callbackName] = (data) => {
          cleanUp();
          resolve(data);
        };

        script.onerror = () => {
          cleanUp();
          reject(new Error("امکان برقراری ارتباط با وب‌سرویس گوگل وجود ندارد."));
        };

        timer = setTimeout(() => {
          cleanUp();
          reject(new Error("مهلت زمان پاسخ‌گویی به پایان رسید. لطفاً مجدد تلاش کنید."));
        }, timeoutMs);

        const sep = url.includes('?') ? '&' : '?';
        script.src = `${url}${sep}callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const nid = normalizeDigits(nidInput.value);
      const phone = normalizeDigits(phoneInput.value);

      if (nid.length !== 10) {
        showAlert("کد ملی باید دقیقاً ۱۰ رقم باشد.");
        return;
      }

      if (phone.length !== 11 || !phone.startsWith("09")) {
        showAlert("شماره همراه باید ۱۱ رقم بوده و با 09 شروع شود.");
        return;
      }

      setLoading(true);

      const requestUrl = `${SCRIPT_URL}?nid=${encodeURIComponent(nid)}&phone=${encodeURIComponent(phone)}`;

      try {
        const res = await fetchJSONP(requestUrl);

        if (res.status === 'success' && res.data) {
          document.getElementById('resM1').textContent = formatNumber(res.data.m1);
          document.getElementById('resM2').textContent = formatNumber(res.data.m2);
          document.getElementById('resM3').textContent = formatNumber(res.data.m3);
          document.getElementById('resMsg').textContent = res.data.msg || "پیامی ثبت نشده است.";

          form.style.display = 'none';
          resultBox.style.display = 'block';
        } else if (res.status === 'not_found') {
          showAlert(res.message || "اطلاعاتی با این مشخصات یافت نشد.");
        } else {
          showAlert(res.message || "خطا در دریافت اطلاعات.");
        }
      } catch (err) {
        showAlert(err.message || "خطا در ارتباط با سرور.");
      } finally {
        setLoading(false);
      }
    });

    resetBtn.addEventListener('click', () => {
      resultBox.style.display = 'none';
      form.style.display = 'block';
      nidInput.value = '';
      phoneInput.value = '';
      hideAlert();
      nidInput.focus();
    });
  </script>
</body>
</html>
