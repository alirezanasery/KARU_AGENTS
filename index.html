<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پورتال استعلام وضعیت مالی نمایندگان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #f87171;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text-main);
      font-size: 1rem;
      transition: all 0.2s ease;
      direction: ltr;
      text-align: right;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .form-group input::placeholder {
      color: #475569;
    }

    button.btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #0b1120;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button.btn-submit:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    button.btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(11, 17, 32, 0.3);
      border-top-color: #0b1120;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 1rem;
      border-radius: 0.75rem;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }

    .alert-error {
      background-color: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--error);
    }

    .result-section {
      display: none;
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 1.75rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .agent-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 0.5rem;
      text-align: center;
    }

    .metric-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      direction: ltr;
    }

    .message-card {
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
    }

    .message-card h4 {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .message-card p {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header">
        <h1>پورتال اطلاع‌رسانی نمایندگان</h1>
        <p>جهت استعلام وضعیت، اطلاعات زیر را وارد نمایید</p>
      </div>

      <form id="queryForm">
        <div class="form-group">
          <label for="nid">کد ملی</label>
          <input type="text" id="nid" placeholder="مثال: 1050781538" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="phone">شماره موبایل</label>
          <input type="tel" id="phone" placeholder="مثال: 09378852305" required autocomplete="off">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">استعلام وضعیت</span>
        </button>
      </form>

      <div class="alert alert-error" id="errorBox"></div>

      <div class="result-section" id="resultBox">
        <div class="agent-name" id="agentName"></div>
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-title">شاخص اول</div>
            <div class="metric-value" id="m1">-</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">شاخص دوم</div>
            <div class="metric-value" id="m2">-</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">شاخص سوم</div>
            <div class="metric-value" id="m3">-</div>
          </div>
        </div>

        <div class="message-card" id="msgContainer" style="display: none;">
          <h4>پیام اختصاصی</h4>
          <p id="agentMessage"></p>
        </div>
      </div>
    </div>

    <div class="footer">
      سامانه یکپارچه گزارشات و عملکرد نمایندگان
    </div>
  </div>

  <script>
    // آدرس خواندن مستقیم شیت شما بدون واسطه اسکریپت
    const SHEET_ID = "13bPVuxgdyrtSOf6lvmf8bQAEFkL8UXfbUxHlBB4G6V0";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=db`;

    const form = document.getElementById("queryForm");
    const nidInput = document.getElementById("nid");
    const phoneInput = document.getElementById("phone");
    const submitBtn = document.getElementById("submitBtn");
    const spinner = document.getElementById("spinner");
    const btnText = document.getElementById("btnText");
    const errorBox = document.getElementById("errorBox");
    const resultBox = document.getElementById("resultBox");

    // پاکسازی اعداد فارسی/عربی و حذف کاراکترهای نامعتبر
    function cleanInput(str) {
      if (!str) return "";
      return str.toString()
        .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
        .replace(/[^0-9]/g, "");
    }

    // فرمت‌بندی اعداد
    function formatNumber(val) {
      if (val === null || val === undefined || val === "") return "-";
      const cleanVal = cleanInput(val);
      if (!isNaN(cleanVal) && cleanVal !== "") {
        return Number(cleanVal).toLocaleString("fa-IR");
      }
      return val;
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      spinner.style.display = isLoading ? "inline-block" : "none";
      btnText.style.display = isLoading ? "none" : "inline";
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    function hideError() {
      errorBox.style.display = "none";
    }

    // تابع پارس دقیق فرمت CSV با پشتیبانی از مقادیر نقل‌قول‌دار
    function parseCSV(text) {
      const lines = text.trim().split(/\r\n|\n/);
      return lines.map(line => {
        const row = [];
        let inQuotes = false;
        let token = "";
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' && (i === 0 || line[i-1] !== '\\')) {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(token.replace(/^"|"$/g, '').trim());
            token = "";
          } else {
            token += char;
          }
        }
        row.push(token.replace(/^"|"$/g, '').trim());
        return row;
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();
      resultBox.style.display = "none";

      const nid = cleanInput(nidInput.value);
      const phone = cleanInput(phoneInput.value);

      if (!nid) {
        showError("لطفاً کد ملی را وارد نمایید.");
        return;
      }

      if (!phone) {
        showError("لطفاً شماره تماس را وارد نمایید.");
        return;
      }

      setLoading(true);

      try {
        const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
        if (!response.ok) {
          throw new Error("خطا در دریافت اطلاعات دیتابیس. دسترسی شیت را بررسی نمایید.");
        }

        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length <= 1) {
          showError("هیچ رکوردی در دیتابیس یافت نشد.");
          return;
        }

        // ردیف اول: هدرها
        const headers = rows[0].map(h => h.toLowerCase());
        const nidIdx = headers.findIndex(h => h.includes("national") || h.includes("کد ملی") || h.includes("کدملی"));
        const phoneIdx = headers.findIndex(h => h.includes("phone") || h.includes("تلفن") || h.includes("موبایل"));
        const m1Idx = headers.findIndex(h => h.includes("metric1") || h.includes("شاخص 1"));
        const m2Idx = headers.findIndex(h => h.includes("metric2") || h.includes("شاخص 2"));
        const m3Idx = headers.findIndex(h => h.includes("metric3") || h.includes("شاخص 3"));
        const msgIdx = headers.findIndex(h => h.includes("message") || h.includes("پیام"));

        const colNid = nidIdx !== -1 ? nidIdx : 0;
        const colPhone = phoneIdx !== -1 ? phoneIdx : 1;
        const colM1 = m1Idx !== -1 ? m1Idx : 2;
        const colM2 = m2Idx !== -1 ? m2Idx : 3;
        const colM3 = m3Idx !== -1 ? m3Idx : 4;
        const colMsg = msgIdx !== -1 ? msgIdx : 5;

        let matchedRow = null;

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const rowNid = cleanInput(row[colNid] || "");
          const rowPhone = cleanInput(row[colPhone] || "");

          // مقایسه با انطباق دقیق یا ۱۰ رقم انتهای شماره (برای پشتیبانی از 0 اول شماره)
          const phoneMatches = (rowPhone === phone) || 
                               (rowPhone.length >= 10 && phone.length >= 10 && (rowPhone.endsWith(phone.slice(-10)) || phone.endsWith(rowPhone.slice(-10))));

          if (rowNid === nid && phoneMatches) {
            matchedRow = row;
            break;
          }
        }

        if (!matchedRow) {
          showError("اطلاعاتی با این مشخصات یافت نشد.");
          return;
        }

        // نمایش اطلاعات رکورد پیدا شده
        const agentName = matchedRow[colMsg] || "نماینده گرامی";
        document.getElementById("agentName").textContent = agentName;
        document.getElementById("m1").textContent = formatNumber(matchedRow[colM1]);
        document.getElementById("m2").textContent = formatNumber(matchedRow[colM2]);
        document.getElementById("m3").textContent = formatNumber(matchedRow[colM3]);

        const msgContainer = document.getElementById("msgContainer");
        const msgText = document.getElementById("agentMessage");
        if (matchedRow[colMsg] && matchedRow[colMsg].trim() !== "") {
          msgText.textContent = matchedRow[colMsg];
          msgContainer.style.display = "block";
        } else {
          msgContainer.style.display = "none";
        }

        resultBox.style.display = "block";

      } catch (err) {
        showError("خطا در برقراری ارتباط: " + (err.message || "خطای نامشخص"));
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
