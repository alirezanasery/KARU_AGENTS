<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه استعلام وضعیت نمایندگان | کارو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-color) 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      direction: ltr;
      text-align: right;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      margin-top: 1.5rem;
    }

    button:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #result-box {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px dashed var(--border-color);
      display: none;
    }

    .greeting-card {
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.4);
      padding: 0.9rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-title {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .metric-value {
      font-weight: 700;
      color: var(--accent-color);
      font-size: 1.05rem;
      direction: ltr;
    }

    .alert {
      padding: 0.9rem;
      border-radius: 12px;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      display: none;
    }

    .alert-danger {
      background: rgba(248, 113, 113, 0.1);
      color: var(--error-color);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">پورتال نمایندگان کارو</span>
      <h1>استعلام وضعیت حساب</h1>
    </div>

    <form id="queryForm">
      <div class="form-group">
        <label for="nid">کد ملی</label>
        <input type="text" id="nid" placeholder="مثال: ۱۰۵۰۷۸۱۵۳۸" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="phone">شماره همراه</label>
        <input type="tel" id="phone" placeholder="مثال: ۰۹۳۷۸۸۵۲۳۰۵" required autocomplete="off">
      </div>

      <button type="submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">مشاهده وضعیت حساب</span>
      </button>
    </form>

    <div id="alertBox" class="alert alert-danger"></div>

    <div id="result-box">
      <div class="greeting-card" id="agentGreeting"></div>
      
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-title">بدهکاری:</span>
          <span class="metric-value" id="val1">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">بستانکاری:</span>
          <span class="metric-value" id="val2">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">مانده حساب:</span>
          <span class="metric-value" id="val3">-</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // پایگاه داده رمزگذاری شده (خروجی مستقیم اسکریپت پایتون)
    // هیچ کس بدون داشتن کدملی و موبایل دقیق نمی‌تواند متن داخل این را بخواند
    const DB_ENCRYPTED = {"5e25eec3940de539": "L9x7FonmIz7PvoVia3cM35ZRrM6KXfa3pzWT5OfQdhrkNClQxq9IZ5VLOWL2FbZoSXRqh26s80yxPY7Vqa3kp+BIp9xxPfy7CibVwTEM9aHZoDrNAo0/QGf8zAs7ISVm9OXT3mf6naQABQNEMVjFYjQaLuTLDJyD3YZZQ/9yEEw=", "4bc0ca32262e9d98": "m/6cKd8he3VUlp2ecHjoNNCYp2pZW4e5ezOvehquzh/WpBxEmiRoXSLwGTUPsyDTj6vBNfYFeZ2lDHqyYcT+LA1YvDS6QOosbytJri7QhFHU2vUvTd4/1wNk7pfh1EmEZQo/mjQXyOOzxJhpIYP2NGy4ZZ62wA==", "b7418d0abe283d23": "WQpwKsMrdFsOE66oK0SFzHbyYyCZbRMW2dheBHI+Ll+ehDBF3TOwZxt0dofZLBJV8KhHgP+4FvGGUgAo6qcYElkx5BorpoQyjh3ge6obSUcuDm3qhXoWix1sN+wSaQ3v2GB15rcWUg=="};

    // تبدیل ارقام فارسی و عربی به انگلیسی
    function normalizeDigits(str) {
      if (!str) return "";
      const farsi = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
      const arabic = ["٠", "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];
      let result = str.toString().trim();
      for (let i = 0; i < 10; i++) {
        result = result.replace(new RegExp(farsi[i], "g"), i).replace(new RegExp(arabic[i], "g"), i);
      }
      return result;
    }

    // تولید کلید جستجو (SHA-256)
    async function getLookupId(str) {
      const msgBuffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("").substring(0, 16);
    }

    // رمزگشایی در کلاینت (AES-GCM با Web Crypto API استاندارد)
    async function decryptRecord(secret, base64Blob) {
      const enc = new TextEncoder();
      const rawData = Uint8Array.from(atob(base64Blob), c => c.charCodeAt(0));
      
      const iv = rawData.slice(0, 12);
      const ciphertext = rawData.slice(12);

      // اشتقاق کلید (PBKDF2)
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(secret),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: enc.encode("karo_bi_salt_2026"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      // دکریپت
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertext
      );

      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    // رویداد استعلام
    document.getElementById("queryForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const alertBox = document.getElementById("alertBox");
      const resultBox = document.getElementById("result-box");
      const submitBtn = document.getElementById("submitBtn");
      const spinner = document.getElementById("spinner");
      const btnText = document.getElementById("btnText");

      alertBox.style.display = "none";
      resultBox.style.display = "none";
      submitBtn.disabled = true;
      spinner.style.display = "inline-block";
      btnText.textContent = "در حال اعتبارسنجی امن...";

      try {
        let nid = normalizeDigits(document.getElementById("nid").value);
        let phone = normalizeDigits(document.getElementById("phone").value);

        // حذف صفر اول تلفن برای یکپارچگی
        if (phone.startsWith("0")) phone = phone.substring(1);

        const secret = nid + "_" + phone;
        const lookupId = await getLookupId(secret);

        const encryptedBlob = DB_ENCRYPTED[lookupId];

        if (!encryptedBlob) {
          throw new Error("اطلاعاتی با این مشخصات یافت نشد. لطفاً کد ملی و تلفن همراه را بررسی نمایید.");
        }

        // رمزگشایی سریع
        const data = await decryptRecord(secret, encryptedBlob);

        // نمایش اطلاعات
        document.getElementById("agentGreeting").textContent = data.message || "اطلاعات حساب شما:";
        document.getElementById("val1").textContent = data.metric1 || "-";
        document.getElementById("val2").textContent = data.metric2 || "-";
        document.getElementById("val3").textContent = data.metric3 || "-";

        resultBox.style.display = "block";

      } catch (err) {
        alertBox.textContent = err.message || "خطا در رمزگشایی یا تطبیق اطلاعات.";
        alertBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "مشاهده وضعیت حساب";
      }
    });
  </script>
</body>
</html>
